<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b2035"><title>The Whispering Attic | The Oddity Orchard</title><link rel="stylesheet" href="style.css?v=attic-entry-1"><style>
body.attic-page{background:#241c2d;color:#f5e9d7}.attic-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 4%;background:#2c2135}.attic-header a{color:#f7e5c5}.attic-header .attic-back{border:1px solid #ae8aab;border-radius:25px;padding:9px 14px}.attic-scene{position:relative;max-width:1920px;margin:auto;overflow:hidden;line-height:0}.attic-scene img{display:block;width:100%;height:auto}.attic-hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:2;border-radius:12px}.attic-hotspot:focus-visible{outline:3px solid #fff0a5;outline-offset:3px}.attic-riddle{left:30.5%;top:42%;width:14.5%;height:21%}.attic-word{left:42.5%;top:43%;width:16%;height:23%}.attic-logic{left:55.5%;top:45%;width:17%;height:23%}.attic-cipher{left:70%;top:49%;width:20%;height:23%}.attic-riddle::after{content:"✦";position:absolute;top:5%;right:10%;color:#ffe5a1;font-size:clamp(15px,2.5vw,35px);line-height:1;filter:drop-shadow(0 0 7px #fff0a5);animation:attic-twinkle 3s ease-in-out infinite}@keyframes attic-twinkle{50%{opacity:.25;transform:scale(.65)}}.attic-caption{text-align:center;padding:22px 18px 45px;line-height:1.6}.attic-caption h1{font-size:clamp(24px,3.5vw,40px);margin:0 0 7px}.attic-caption p{margin:0;color:#d5c3d9}.attic-modal[hidden]{display:none}.attic-modal{position:fixed;inset:0;z-index:30;background:#100d16c9;display:grid;place-items:center;padding:16px}.attic-dialog{position:relative;width:min(520px,100%);max-height:90vh;overflow:auto;border:3px solid #b89363;border-radius:18px;background:#f5e7ca;color:#453323;padding:28px;box-shadow:0 12px 65px #0009;line-height:1.6}.attic-dialog h2{font-size:clamp(25px,4vw,35px);margin:5px 0 12px}.attic-dialog p{margin:10px 0}.attic-dialog button{cursor:pointer}.attic-close{position:absolute;right:12px;top:8px;border:0;background:transparent;font-size:30px;color:#5e415b}.attic-answer{width:100%;font:inherit;border:1px solid #aa8b73;border-radius:8px;padding:12px;background:#fffaf1;color:#33261d}.attic-submit{margin-top:12px;background:#59446e;color:white;border:0;border-radius:25px;padding:12px 20px;font:inherit}.attic-feedback{min-height:1.5em;font-weight:bold}.attic-intro{position:fixed;inset:0;background:#1e1828;z-index:25;pointer-events:none;opacity:0;animation:attic-reveal 1.5s ease-out both}@keyframes attic-reveal{0%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.attic-riddle::after{animation:none}.attic-intro{animation:none;display:none}}@media(max-width:600px){.attic-header{font-size:13px}.attic-dialog{padding:22px}.attic-hotspot{min-height:28px}}
</style></head><body class="attic-page"><header class="attic-header"><a href="shop.html">✿ The Oddity Orchard</a><a class="attic-back" href="shop.html">← Return to Shop</a></header><main><div class="attic-scene"><img src="Attic_Img_2.png" alt="The Whispering Attic: Elf the goose sunbathes by the window, a black cat rests by the balcony, and three mystery boxes sit under purple dust covers beside the glowing Riddle Box."><button class="attic-hotspot attic-riddle" data-box="riddle" aria-label="Open the Riddle Box"></button><button class="attic-hotspot attic-word" data-box="word" aria-label="Examine the covered Word Box"></button><button class="attic-hotspot attic-logic" data-box="logic" aria-label="Examine the covered Logic Box"></button><button class="attic-hotspot attic-cipher" data-box="cipher" aria-label="Examine the covered Cipher Box"></button></div><section class="attic-caption"><h1>The Whispering Attic</h1><p>One mystery is awake. The others are sleeping. Elf requests that you keep your voice down.</p></section></main><div class="attic-intro" aria-hidden="true"></div><div class="attic-modal" id="attic-modal" hidden><section class="attic-dialog" role="dialog" aria-modal="true" aria-labelledby="attic-title"><button class="attic-close" id="attic-close" aria-label="Close puzzle">×</button><div id="attic-content"></div></section></div><script>
(()=>{const modal=document.getElementById('attic-modal'),content=document.getElementById('attic-content'),close=document.getElementById('attic-close');let previous=null;const open=(box)=>{previous=document.activeElement;modal.hidden=false;if(box==='riddle'){content.innerHTML='<small>THE WHISPERING ATTIC · PRACTICE RIDDLE</small><h2 id="attic-title">The Riddle Box</h2><p><em>I have a face but never smile.<br>I have hands but never hold.<br>I keep what you can never catch,<br>And count what cannot be sold.</em></p><form id="riddle-form"><label for="riddle-answer">What am I?</label><input id="riddle-answer" class="attic-answer" autocomplete="off" required><button class="attic-submit" type="submit">Tell the Shopkeeper</button></form><p class="attic-feedback" id="riddle-feedback" aria-live="polite"></p><small>Practice puzzle only. Real prizes and member accounts are not active yet.</small>';document.getElementById('riddle-form').addEventListener('submit',e=>{e.preventDefault();const guess=document.getElementById('riddle-answer').value.toLowerCase().replace(/[^a-z ]/g,'').trim();document.getElementById('riddle-feedback').textContent=['clock','a clock','the clock','watch','a watch','the watch'].includes(guess)?'Correct! A clock. Wonderful. You can tell time. I’ll alert the mushrooms. — LB':'Not quite. Elf recommends thinking about faces and hands.'});document.getElementById('riddle-answer').focus()}else{const names={word:'Word',logic:'Logic',cipher:'Cipher'};content.innerHTML='<small>THE WHISPERING ATTIC</small><h2 id="attic-title">The '+names[box]+' Box</h2><p><em>“I wouldn’t lift that cloth just yet. Last time someone tried, the box started humming. And Elf bit somebody.”</em></p><p>— LB, Keeper of the Oddities</p><p>This mystery has not awakened yet.</p>';close.focus()}};document.querySelectorAll('[data-box]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.box)));function dismiss(){modal.hidden=true;previous?.focus()}close.addEventListener('click',dismiss);modal.addEventListener('click',e=>{if(e.target===modal)dismiss()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)dismiss();if(e.key==='Tab'&&!modal.hidden){const els=[...modal.querySelectorAll('button,input')].filter(x=>x.offsetParent!==null);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}})})();
</script></body></html>
